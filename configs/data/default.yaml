# Configuración del pipeline de datos
data_path: "data/silver/silver_set.jsonl"  # silver labels del LLM (escala continua [0,1])
model_name: "eventdata-utd/ConfliBERT-Spanish-Beto-Cased-v1"
max_length: 512          # tokens máximos por noticia (límite de BERT)

# DataLoader
batch_size: 16
num_workers: 4
pin_memory: true

# Splits
val_split: 0.15
test_split: 0.15
seed: 42

splits_path: "data/processed/splits.json"
