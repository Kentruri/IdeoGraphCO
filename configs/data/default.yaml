# Configuración del pipeline de datos (article-level, con chunking).
#
# El JSONL de entrada puede estar en dos formatos:
#   - Nuevo (categórico): {"label": "populismo"}  o  {"label_idx": 2}
#   - Legacy (silver continuo): 8 floats por eje → argmax al vuelo
# Ver docs/preguntas-director.md tema 5.
data_path: "data/silver/silver_set.jsonl"
model_name: "eventdata-utd/ConfliBERT-Spanish-Beto-Cased-v1"

# Chunking (V_doc = mean V_chunk_i)
chunk_size: 512            # tokens por chunk (límite BERT)
chunk_stride: 384          # solapamiento (25%)
max_chunks: 8              # cap para artículos muy largos
chunking_strategy: "sliding_window"  # "truncate" | "sliding_window"

# DataLoader
batch_size: 16
num_workers: 4
pin_memory: true

# Splits (usa gold humano como test si existe splits_path)
val_split: 0.15
test_split: 0.15
seed: 42

splits_path: "data/processed/splits.json"
