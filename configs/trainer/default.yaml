# Configuración del Trainer de Lightning
max_epochs: 10
accelerator: "auto"
devices: 1

# precision="auto" → fp32 en MPS/CPU (fp16 tiene bugs en MPS),
# 16-mixed / bf16-mixed en CUDA (según generación).
# Resolución en train.py:_resolve_precision().
precision: "auto"

# fast_dev_run: si true, corre 1 batch de train/val/test para smoke-test.
# Útil para validar la pipeline sin gastar horas de cómputo.
fast_dev_run: false

# Callbacks — monitor sobre F1 Macro (métrica principal del PDF OE3)
early_stopping:
  monitor: "val/f1_macro"
  patience: 3
  mode: "max"

model_checkpoint:
  monitor: "val/f1_macro"
  mode: "max"
  save_top_k: 2
  filename: "ideoclassifier-epoch{epoch:02d}-f1{val/f1_macro:.3f}"

log_every_n_steps: 10
