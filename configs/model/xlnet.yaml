# XLNet — requerido por el anteproyecto (OE2).
#
# ⚠️ TBD — No existe versión oficial de XLNet en español. Ver
# docs/preguntas-director.md tema 4. Opciones:
#   A) xlnet-base-cased (inglés, cross-lingual — probablemente subóptimo)
#   B) flax-community/xlnet-base-spanish (comunitario, no oficial)
#   C) Reemplazar por mDeBERTa: microsoft/mdeberta-v3-base
#
# Placeholder actual (opción C, recomendada por el equipo). Reemplazar
# tras la decisión del director.
model_name: "microsoft/mdeberta-v3-base"
encoder_alias: "xlnet"  # nombre mantiene compatibilidad con el PDF
num_classes: 8

learning_rate: 2e-5
dropout: 0.1
weight_decay: 0.01
warmup_ratio: 0.1
freeze_encoder_epochs: 0

use_politicity_head: false
