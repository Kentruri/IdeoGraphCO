# XLNet — requerido por el anteproyecto (OE2).
#
# Decisión (ago-2026): opción A — el XLNet original en inglés. No existe
# versión oficial en español y se mantiene el modelo comprometido en el
# anteproyecto; su bajo desempeño esperado sobre texto en español es un
# hallazgo del benchmark, no un error de configuración.
#
# Nota técnica: XLNet no usa max_position_embeddings fijo como BERT (atención
# relativa), y su tokenizer es SentencePiece. El pipeline de chunking funciona
# igual (512 tokens por bloque), pero el vocabulario es inglés: el texto en
# español se fragmentará en más subtokens.
model_name: "xlnet-base-cased"
encoder_alias: "xlnet"  # nombre mantiene compatibilidad con el PDF
num_classes: 8

learning_rate: 2e-5
dropout: 0.1
weight_decay: 0.01
warmup_ratio: 0.1
freeze_encoder_epochs: 0

use_politicity_head: false
